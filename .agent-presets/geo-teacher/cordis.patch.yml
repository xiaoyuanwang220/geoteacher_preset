# 地理教师辅助 Agent preset —— 声明行形态（DSH ≥ 0.2.1-rc.2；本机实测/已验证版本 0.2.2-rc.1，见 docs/DSH-0.2.1-rc.2-基线.md 现行节）。
#
# 旧形态 `$DSH_HOME/.agent-presets/<id>/{preset.yml,agent.cordis.yml}` 已被移除：
# 当前版本只认由 bundle patch 插入的 `@deepseek-ai/dsh-agent-preset` Loader 行。
#   config.id       = 会话保存的 preset 身份（小写字母/数字/连字符）
#   config.plugins  = 该 preset 的 Cordis entry list（原 agent.cordis.yml 内容，整体缩进 +10）
#   name/description/order = 预设选择器里的显示信息与排序
#
# 本目录自身即 bundle（package.json 的 dsh.bundle.patch 指向本文件）。
#
# 0.2.2-rc.1 适配（2026-11-07）：删除 `@deepseek-ai/dsh-tool-subagent-control/list-agents`
# 声明行——该子路径在新版已移除、list_agents 并入主入口；照旧声明会让整条 preset
# 挂载失败（新建会话报 agent-preset/invalid）。详见 delegation 组注释。
#
# ⚠ 模块名解析基准：声明行由 profile 补丁层插入，registry 用
#    `mountPreset(scope.ctx.extend({ baseUrl: record.context.baseUrl }), ...)`
#    挂载 plugins；record.context 是声明插件自己的 ctx，其 baseUrl 是
#    **profile 目录**（$DSH_HOME/profiles/desktop/），不是本 bundle 目录。
#    所以 `./plugins/x/index.js` 会被解析成 profiles/desktop/plugins/x/index.js，
#    import 直接 ERR_MODULE_NOT_FOUND：entry 拿不到 fiber，auditRows 报
#    "<id> (<name>): never started"，整个 preset 挂载失败并写进 record.broken。
#    本地插件因此一律走本包的 subpath exports（见 package.json 的 exports）。
#    skills 目录同理：用 createRequire(baseUrl) 先定位本包再拼 'skills'。
- insert:
    - id: preset-geo-teacher
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: geo-teacher
        name: 地理教师辅助
        description: >-
          基于 cordis 模式并内置「地理教师辅助 Agent」：本地真题库考点树浏览、真题分析（为什么这样考）、
          命题蓝图（下一道题怎么设计）、真题风格出题。
        order: 10
        plugins:
          # ── identity ────────────────────────────────────────────────────────────────

          # The preset's own persona, shadowing the deployment default for this agent.
          # 模板变量契约（DSH 0.2.1-rc.2 实测）：本段只注册 `provider` 与 `model`。
          # 0.1.7-rc.2 时还能用的 `{{cwd}}` 已不再注册，写它会**让整轮运行失败**：
          #   unknown prompt variable "{{cwd}}" in section "deployment:persona-prefix"
          # persona 的模板是「渲染时严格解析」的，不是宽松替换——未注册的变量直接报错。
          # 工作目录改由运行时上下文提供（persona 的 includeRuntimeContext 默认 true，
          # 会在系统提示里给出 "Current working directory"）。
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: >-
                You are a coding agent powered by the {{model}} model.

                [Geo 地理教师辅助 · 路由与底线]
                - 工具归属：检索/浏览 geo_taxonomy、geo_search_questions、geo_question_detail、geo_style_profile；命题研究 geo_analyze、geo_export_analysis；讲题 geo_solve → geo_judge → geo_explain。
                - 需求路由：只问怎么做／怎么解 → 只调用 geo_solve，返回独立作答与关键依据，不自动进入核验与讲稿；要求讲题／讲解这道题 → 连续完成 geo_solve → geo_judge（先打开答案、再提交 conclusion 归档）→ geo_explain，中途不询问是否继续，只有缺关键题面或图片时才暂停；分析命题设计 → geo_analyze，需要把已核验结果整理成命题人讲稿时才用 geo_explain 的 setter 对象。
                - 答案隔离底线：解题只在隔离解题会话内完成；主会话不得自己解题、不得直读题库 md 或图片、不得把答案提前交给解题侧。
                - 题源边界：题库题（有 qid）一律走 geo_solve；教师上传的图片题不在本轮隔离讲题流程内，需要时按普通答疑处理，不得冒充讲题流水线产物。
                - 状态与核验口径：服务端状态为 题面就绪 → 作答已提交 → 核验完成；标准答案与解析只在作答提交后由 geo_judge 开放，核验结论归档后才生成讲稿，讲稿只读服务端核验记录；缺前置状态时如实报告缺什么，不得自称已核验；"核验完成"不等于内容正确。
                - 执行细则见技能 geo-solver 与 geo-question-explainer，三对象写法见技能 references。

          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536

          # ── shell ───────────────────────────────────────────────────────────────────

          # `shell-env` stays in the HOST composition: `apps/cli/src/web.ts` injects it to
          # publish `DSH_WEB_URL`/`DSH_WEB_MODE`, and a host row that injects a service is
          # the criterion for host-plane ownership — injection resolves before any session
          # exists, so there is no agent to key by. Behind a preset realm those variables
          # never reached the model's shell at all. Both shell tools consume the host
          # registry from here; their executors (`bash-sandbox`/`pwsh-sandbox`) are
          # host-plane too.
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'

          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'

          # ── filesystem ──────────────────────────────────────────────────────────────

          # Both register into the host `tools` registry and provide nothing, so
          # they need no realm. The `fs` service and its policy stay in the host.
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'

          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false

          # ── background jobs ────────────────────────────────────────────────────────

          # Only the model-facing controls. The task REGISTRY stays on the host plane.
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'

          # ── skills ──────────────────────────────────────────────────────────────────

          # The skill REGISTRY lives in the host composition and is layered per scope:
          # these rows register into THIS preset's layer of it, so they need no realm.
          # `skill-filesystem` contributes local-root discovery for agents on this preset, and
          # `tool-skill` gives them the catalog and loader; the merged catalog also
          # carries whatever the deployment registered globally (repository plugins).
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
            config:
              customSkillDirs:
                # 预设包自身的技能根：出题/解题/讲题/课程方案四个教师技能。
                - !!js "process.getBuiltinModule('node:path').join(process.getBuiltinModule('node:path').dirname(process.getBuiltinModule('node:module').createRequire(baseUrl).resolve('@geo-edu/dsh-geo-teacher-preset/package.json')), 'skills')"

          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'

          # ── 地理教师辅助（插件化：geo group，isolate realm）────────────
          # geo-core 发布 geo.kernel 服务，功能插件在同一 group 内消费它；
          # `isolate: geoKernel` 使该服务仅本 preset 私有，不与其它 preset/会话冲突。
          # 功能插件（taxonomy/bank/analysis/generator）各自注册 /geo/* 路由。
          - id: geo
            name: cordis:group
            group: true
            isolate:
              geoKernel: true
            config:
              - id: geo-core
                name: '@geo-edu/dsh-geo-teacher-preset/plugins/core'
                # 数据路径不在组合文件里写死（写死会让每个用户的安装都指向作者机器）。
                # 由用户配置文件 <DSH_HOME>/geo-teacher/config.json 提供；考点库随包时零配置。
                # 解析优先级与键名见 README「配置数据路径」；/geo/core/health 会回显解析结果。
              - id: geo-taxonomy
                name: '@geo-edu/dsh-geo-teacher-preset/plugins/taxonomy'
              - id: geo-bank
                name: '@geo-edu/dsh-geo-teacher-preset/plugins/bank'
              - id: geo-analysis
                name: '@geo-edu/dsh-geo-teacher-preset/plugins/analysis'
              - id: geo-generator
                name: '@geo-edu/dsh-geo-teacher-preset/plugins/generator'
              # 出题确定性检查：命题包校验/渲染的唯一实现在 plugins/question/package.js，
              # 本插件只注册 geo_question_validate 工具（无 HTTP 路由，故不注入 webServer、不增 isolate 项）。
              - id: geo-question
                name: '@geo-edu/dsh-geo-teacher-preset/plugins/question'

          # ── goals ───────────────────────────────────────────────────────────────────

          # Only the model-facing tool. The goal SERVICE, its session driver, and the
          # `/goal` command stay on the host plane.
          - id: tool-goal
            name: '@deepseek-ai/dsh-tool-goal'

          # ── plan mode ───────────────────────────────────────────────────────────────

          # Plan state is per-agent by nature, so an entry-local realm is not a
          # workaround here — it is the correct lifetime.
          - id: planning
            name: cordis:group
            group: true
            isolate:
              planMode: true
            config:
              - id: plan-mode
                name: '@deepseek-ai/dsh-plan-mode'
                config:
                  section: |
                        You are in plan mode. Stay in plan mode until exit_plan_mode succeeds or the user switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. A user's conversational agreement — including an answer confirming something you asked — approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.

                        Explore first. Use non-mutating reads, searches, static analysis, and checks to ground the plan in the actual repository. Do not edit or write files, change configuration, run formatters or code generation that rewrites tracked files, commit, or otherwise carry out the plan. Prefer existing functions and patterns over new machinery.

                        The tool catalog stays the same across modes for request-cache stability. These plan-mode rules override any later tool description or guidance that suggests using mutation tools; those tools remain listed to keep the tool catalog unchanged. Do not use todo_write to track this planning phase: it tracks implementation after an approved plan, while the plan itself belongs in exit_plan_mode.

                        Resolve discoverable facts by inspection. Use ask_user_question only for user-owned choices or material ambiguity that inspection cannot answer. Do not ask the user where code lives or how current behavior works when you can find out.

                        Make the plan decision-complete: state the goal and success criteria; group implementation changes by subsystem; identify public API, schema, and data-flow changes; cover edge cases, failure modes, tests, acceptance criteria, and explicit assumptions. Keep it concise enough to review but detailed enough that another engineer can implement it without making design decisions.

                        When ready, call exit_plan_mode with the complete plan markdown, starting with a # title. Make exit_plan_mode the only and final tool call in that assistant response: it presents the plan for approval, and implementation begins only in a later step after approval. Do not paste the final plan as a plain reply or ask "should I proceed?" through prose or ask_user_question. If review rejects it, incorporate the feedback and present again. If the review channel is unavailable or aborted, stay in plan mode and ask the user to switch modes manually; do not proceed with implementation.

          # ── compaction ──────────────────────────────────────────────────────────────

          # `compaction-basic` reads `toolResultPrune` through `ctx.get`, so the pruner must
          # share this realm rather than sit outside it.
          #
          # `tokenMeter` is deliberately NOT in this realm: the meter stays on the HOST
          # plane, and the rows here resolve that one instance.
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'

              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'

              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024

          # ── delegation and workflows ────────────────────────────────────────────────

          # The `subagents` registry and its spawn/fork backends live in the HOST
          # composition. This preset contributes the delegation TOOLS, which resolve
          # that host registry.
          #
          # ⚠ `list_agents` 不要单独声明行。0.2.2-rc.1 起 `@deepseek-ai/dsh-tool-subagent-control`
          # 把 list_agents 并进主入口（lib/index.js 的 apply 内注册），并删除了
          # `./list-agents` 子路径导出；照旧写 `@deepseek-ai/dsh-tool-subagent-control/list-agents`
          # 会让该行 import 失败、entry 拿不到 fiber，auditRows 报
          # "<id> (<name>): never started"，整个 preset 挂载失败（新建会话报
          # agent-preset/invalid）。0.2.1-rc.5 及更早该子路径仍在、主入口只注册
          # send_message/interrupt_agent；list_agents 不在本预设工作流内，删掉该行后
          # 两代都能挂载（0.2.2 由主入口提供 list_agents，0.2.1 少这一个工具）。
          #
          # `workflow-ptc` 是现行工作流引擎包：旧版 preset 引用的
          # `@deepseek-ai/dsh-workflow-worker-thread` 已不存在；配置键 0.2.1-rc.5 起
          # 就是 `provider`（写成 `subagentProvider` 会被静默忽略并回落到默认 spawn）。
          - id: delegation
            name: cordis:group
            group: true
            isolate:
              workflowEngine: true
            config:
              - id: tool-subagent-control
                name: '@deepseek-ai/dsh-tool-subagent-control'

              # 委派一律 continuable；`backgroundMode` 已不在 Config（0.2.1-rc.5 起即无此键），
              # 旧写法会被静默忽略，故不再保留。
              - id: tool-subagent
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: subagent

              - id: tool-subagent-fork
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: fork
                  toolName: subagent_fork

              # Product providers are host-plane singletons. Remove `disabled` from
              # either row to expose that product only to agents composed from this preset.
              - id: tool-subagent-codex
                name: '@deepseek-ai/dsh-tool-subagent'
                disabled: true
                config:
                  provider: codex
                  toolName: subagent_codex
                  maxDepth: provider-managed

              - id: tool-subagent-claude-code
                name: '@deepseek-ai/dsh-tool-subagent'
                disabled: true
                config:
                  provider: claude-code
                  toolName: subagent_claude_code
                  maxDepth: provider-managed

              - id: workflow-ptc
                name: '@deepseek-ai/dsh-workflow-ptc'
                config:
                  provider: spawn

              - id: tool-workflow
                name: '@deepseek-ai/dsh-tool-workflow'

              - id: tool-ralph
                name: '@deepseek-ai/dsh-tool-ralph'
                config:
                  subagentProvider: spawn
                  maxRounds: 64

          # ── remaining model-facing rows ─────────────────────────────────────────────

          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'

          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true

          # The `web` service and its search provider stay in the host composition; only
          # the model-facing tool is per-session.
          #
          # fetch: true —— 2026-09-27（M0）按证据需求启用：出题需要读取热点/政策正文、课标原文与
          # 论文摘要，仅有 web_search 只能拿到来源链接（线索级）。宿主侧 web-fetch-http 提供方已在
          # 本 profile 会话中实测可用（可读到官方页面正文）；本行只注册模型可见的 web_fetch，
          # 不重复注册整套 web 服务。改动属组合层，需完整重启桌面后验收。
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000

    # ── 内部解题预设（隔离解题会话，供 geo_solve 自动调用）────────────────────────────
    #
    # 为什么单独一个 preset：子 agent 的工具与 persona 只由它自己的 preset 决定（dsh-subagent 源码：
    # persona/toolFilter 已不在工具参数里，必须配置在 preset 中）。本 preset 只有一行插件：
    #   plugins/solver-isolation —— 提供解题 persona（读取 skills/geo-solver.md 正文）+
    #   在 preset 作用域内隐藏并拒绝一切继承来的全局工具。
    # 只在 bundle patch 里声明、不在 profile package.json 里新增 bundle；会话选择器会出现该预设
    # （name/order 已标明内部使用），请勿手动选择。
    - id: preset-geo-solver-internal
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: geo-solver-internal
        name: 地理解题隔离会话（内部）
        description: >-
          讲题流水线内部使用：只接收题面与题面图片并独立作答，不开放文件、命令、联网、命题分析、
          会话检索与代理工具。日常使用请选择「地理教师辅助」。
        order: 999
        plugins:
          - id: solver-isolation
            name: '@geo-edu/dsh-geo-teacher-preset/plugins/solver-isolation'

