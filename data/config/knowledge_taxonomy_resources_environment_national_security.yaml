        source_document: 普通高中教科书·地理选择性必修3 资源、环境与国家安全
        source_locator: 第二章第三节"中国的耕地资源与粮食安全"
    status: draft
    confidence: high
    needs_review: false
    review_note: ""

  - id: KU-RES-RES-004
    level: knowledge_unit
    name: 海洋空间资源开发与国家安全
    parent_id: TH-RES-RES
    definition: 海洋空间资源开发利用对国家资源供给和海洋国土安全的影响。
    includes:
