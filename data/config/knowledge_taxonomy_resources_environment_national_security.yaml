  # ---------- 主题 1：资源环境与人类社会 ----------
  - id: TH-RES-SOC
    level: theme
    name: 资源环境与人类社会
    parent_id: DM-RES
    definition: 研究自然环境对人类社会的服务功能、自然资源的属性与利用特征，以及环境问题产生的原因与危害。
    includes: []
    excludes:
      - 自然环境各要素的组成与运动规律（归入自然地理）
    aliases: []
    source_refs:
      - ima_knowledge_base: aaa
        source_document: 普通高中教科书·地理选择性必修3 资源、环境与国家安全
        source_locator: 第一章
    status: draft
    confidence: high
    needs_review: false
    review_note: ""

  - id: KU-RES-SOC-001
    level: knowledge_unit
    name: 自然环境的服务功能
    parent_id: TH-RES-SOC
    definition: 自然环境为人类提供供给、调节、文化和支撑四类服务功能，人类可持续利用不能突破其极限。
    includes:
      - 供给服务（提供自然资源）
      - 调节服务（调节温度、净化空气、降解废弃物）
      - 文化服务（精神享受、审美体验）
      - 支撑服务（维持自然环境自身稳定，是其他服务的基础）
      - 服务功能的可持续利用极限与综合权衡
    excludes:
      - 具体森林、湿地等生态系统的服务功能计算
    aliases: []
    source_refs:
      - ima_knowledge_base: aaa
        source_document: 普通高中教科书·地理选择性必修3 资源、环境与国家安全
        source_locator: 第一章第一节"自然环境的服务功能"
    status: draft
    confidence: high
    needs_review: false
    review_note: ""

  - id: KU-RES-SOC-002
    level: knowledge_unit
    name: 自然资源及其利用
    parent_id: TH-RES-SOC
    definition: 自然资源的概念、双重属性（自然与社会）及其数量、质量和空间分布特征对人类利用的影响。
    includes:
      - 自然资源的定义与主要类型（气候、生物、水、土地、矿产、能源、海洋资源）
      - 自然资源的自然属性与社会属性
      - 数量特征（有限性、稀缺性、价格响应机制）
      - 质量特征（优劣分级、开发利用成本差异）
      - 空间分布特征（不均匀但有规律、地带性与区域性、资源流动与调配）
      - 可再生资源与非可再生资源的更新极限
    excludes:
      - 具体资源类型的分布数据（作为案例而非知识节点）
    aliases: []
    source_refs:
      - ima_knowledge_base: aaa
        source_document: 普通高中教科书·地理选择性必修3 资源、环境与国家安全
        source_locator: 第一章第二节"自然资源及其利用"
    status: draft
    confidence: high
    needs_review: false
    review_note: ""

  - id: KU-RES-SOC-003
    level: knowledge_unit
    name: 环境问题的形成与危害
    parent_id: TH-RES-SOC
    definition: 人类活动超出自然环境调节能力导致环境问题产生，并通过损害自然环境服务功能影响人类健康和社会经济发展。
    includes:
      - 环境问题产生的原因（资源获取与废弃物排放超出自然环境调节能力）
      - 影响环境问题的主要因素（人口数量、人均资源消费量、技术水平两面性）
      - 环境问题的危害（影响生活质量与健康、制约社会经济发展）
      - 自然系统与人类系统物质能量流动的差异
      - 环境问题的主要表现（环境污染、生态破坏、自然资源枯竭）
      - 环境问题的区域差异及由局部向全球扩展的趋势
    excludes:
      - 具体环境事件案例（如DDT、琵琶湖等）
      - 具体污染物的理化特性
    aliases: []
    source_refs:
      - ima_knowledge_base: aaa
        source_document: 普通高中教科书·地理选择性必修3 资源、环境与国家安全
        source_locator: 第一章第三节"环境问题及其危害"
      - ima_knowledge_base: aaa
        source_document: 普通高中教科书·地理必修 第二册
        source_locator: 第五章第一节"人类面临的主要环境问题"
    status: draft
    confidence: high
    needs_review: false
    review_note: ""

  - id: KU-RES-SOC-004
    level: knowledge_unit
    name: 海洋生物资源与渔场形成条件
    parent_id: TH-RES-SOC
    definition: 海洋生物资源的形成与富集受光照、水深、营养盐、洋流及栖息环境等自然条件共同影响。
    includes:
      - 大陆架浅海的水深与光照条件
      - 寒暖流交汇和上升流对营养物质上泛及生物聚集的作用
      - 入海径流输送营养盐对浮游生物和饵料资源的影响
      - 海岸、岛屿等环境对海洋生物栖息和繁殖的作用
      - 渔场形成的主要自然条件
    excludes:
      - 洋流的一般形成与分布规律（归入洋流节点）
      - 海洋空间开发与海洋权益（归入海洋空间资源开发与国家安全节点）
    aliases:
      - 海洋生物资源
      - 渔场形成条件
    source_refs:
      - ima_knowledge_base: aaa
        source_document: 普通高中教科书·地理选择性必修3 资源、环境与国家安全
        source_locator: 第一章第二节"自然资源及其利用"（生物资源、海洋资源）
      - ima_knowledge_base: aaa
        source_document: 普通高中教科书·地理必修 第一册
        source_locator: 第三章第三节"海水的运动"（洋流对海洋生物资源和渔场的影响）
    validation_refs:
      - source_document: 精品解析：2025年浙江6月高考地理真题（解析版）.docx
        question_numbers: "26(2)"
    status: draft
    confidence: high
    needs_review: false
    review_note: "经代表性真题验证，可作为海洋资源相关的独立 L3 知识单元。"

  # ---------- 主题 2：资源安全 ----------
  - id: TH-RES-RES
    level: theme
    name: 资源安全
    parent_id: DM-RES
    definition: 研究资源供需失衡引发的安全问题及其对国家安全的影响，包括能源、耕地粮食和海洋空间资源等具体领域的安全保障。
    includes: []
    excludes:
      - 一般性的农业区位和工业区位因素（归入人文地理）
      - 具体国家或地区的资源开发案例
    aliases: []
    source_refs:
      - ima_knowledge_base: aaa
        source_document: 普通高中教科书·地理选择性必修3 资源、环境与国家安全
        source_locator: 第二章
    status: draft
    confidence: high
    needs_review: false
    review_note: ""

  - id: KU-RES-RES-001
    level: knowledge_unit
    name: 资源安全与国家安全的关系
    parent_id: TH-RES-RES
    definition: 资源供给与需求失衡超过限度引发资源安全问题，战略资源短缺可动摇国家安全基础。
    includes:
      - 资源安全的概念（供给满足最低数量和质量要求、稳定及时经济、不破坏自然环境）
      - 资源安全问题的成因（供需失衡：需求增长过快或供给能力降低）
      - 影响因素（资源禀赋、生产与供给能力、消费需求）
      - 资源安全在国家安全体系中的基础地位
      - 战略资源与非战略资源的区分
      - 资源安全问题影响国家安全的途径（触发环境、经济、军事、政治危机）
      - 保障资源安全的途径（增加供给、降低需求、规避衍生风险）
    excludes:
      - 具体资源类型的安全问题（分别归入能源安全、耕地资源与粮食安全等节点）
    aliases: []
    source_refs:
      - ima_knowledge_base: aaa
        source_document: 普通高中教科书·地理选择性必修3 资源、环境与国家安全
        source_locator: 第二章第一节"资源安全对国家安全的影响"
    status: draft
    confidence: high
    needs_review: false
    review_note: ""

  - id: KU-RES-RES-002
    level: knowledge_unit
    name: 能源安全
    parent_id: TH-RES-RES
    definition: 能源供给、消费和空间配置失衡形成的安全风险，以及通过供给多元化、储备、运输保障和结构优化维护能源安全的机制。
    includes:
      - 能源供给结构、消费结构和供需空间错位对能源安全的影响
      - 油气对外依存与运输通道风险
      - 以煤为主的能源结构带来的环境约束和转型要求
      - 保障措施（提升国内供给能力、进口来源多元化、战略储备、运输通道保障）
      - 优化能源消费结构和提高能源利用效率
      - 碳排放系数与能源结构对碳排放的影响
    excludes:
      - 具体油田、煤矿名称作为独立知识点
      - 具体能源政策文件名称
      - 特定年份的能源产量、消费量和对外依存度数据
    aliases: []
    source_refs:
      - ima_knowledge_base: aaa
        source_document: 普通高中教科书·地理选择性必修3 资源、环境与国家安全
        source_locator: 第二章第二节"中国的能源安全"
    status: draft
    confidence: high
    needs_review: false
    review_note: ""

  - id: KU-RES-RES-003
    level: knowledge_unit
    name: 耕地资源与粮食安全
    parent_id: TH-RES-RES
    definition: 耕地资源的数量、质量和空间分布特征对粮食综合生产能力的决定作用，以及保障粮食安全的途径与耕地保护制度。
    includes:
      - 粮食安全的概念（生产、储备、流通、进出口四环节）
      - 我国耕地资源特征（人均少、质量欠佳、分布不均、气象灾害频发）
      - 粮食总产量与耕地面积和单位面积产量的关系
      - 实现粮食安全的途径（提高单产、跨区调剂、国际贸易、粮食储备）
      - 耕地红线与基本农田保护制度
      - 高标准农田建设与耕地质量提升
      - 国家粮食安全战略（以我为主、立足国内、确保产能、适度进口、科技支撑）
    excludes:
      - 具体农作物品种的种植条件
      - 具体区域中低产田治理案例
    aliases: []
    source_refs:
