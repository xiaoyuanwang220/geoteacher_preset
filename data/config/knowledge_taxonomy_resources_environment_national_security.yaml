# 高中地理 Taxonomy — 资源、环境与国家安全部分（跨册整合草案 v0.2-draft）
#
# 来源：ima 知识库「aaa」→ 高中文件夹
#   - 普通高中教科书·地理选择性必修3 资源、环境与国家安全（人教版 2019，樊杰、高俊昌总主编；方修琦、刘健本册主编）
#   - 普通高中教科书·地理必修 第二册第五章第一、二节（人教版 2019）
#
# 结构：domain -> theme -> knowledge_unit（三层教材主干）
# 本版已比较选择性必修3与必修第二册第五章第一、二节相关原文并完成跨册整合。
# 案例、问题研究、情境、能力表达均未进入主干。
# 所有节点均基于教材原文提取，未使用 Agent 记忆或网络摘要。

meta:
  subject: 高中地理
  taxonomy_name: 资源、环境与国家安全知识点体系（跨册整合草案）
  version: v0.2-draft
  status: draft
  constructed_at: "2026-07-28"
  source_textbooks:
    - ima_knowledge_base: aaa
      source_document: 普通高中教科书·地理选择性必修3 资源、环境与国家安全
      publisher: 人民教育出版社
      edition: 2019
      chief_editor: 樊杰、高俊昌
      volume_editor: 方修琦、刘健
    - ima_knowledge_base: aaa
      source_document: 普通高中教科书·地理必修 第二册
      publisher: 人民教育出版社
      edition: 2019
      relevant_chapters: 第五章第一节"人类面临的主要环境问题"、第二节"走向人地协调——可持续发展"
  construction_basis: 依据 taxonomy_construction_rules.md，从 ima 原文逐节提取知识候选。
  notes:
    - 本文件以选择性必修3为主体，并已整合必修第二册第五章第一、二节中的环境问题和可持续发展主干。
    - 教材册、章、节仅为来源线索，不直接等于 taxonomy 层级。L2 主题根据知识尺度重新组织，非机械照搬教材章名。
    - 同一知识跨册出现时只保留一个节点，source_refs 记录多个来源。
    - needs_review=true 的节点存在粒度、父级或来源疑问，需人工裁定。
    - 本版尚未使用代表性高考真题验证可映射性，结构检查通过不等于定稿。

# ============================================================
# L1 学科领域
# ============================================================
nodes:
  - id: DM-RES
    level: domain
    name: 资源、环境与国家安全
    parent_id: null
    definition: 研究自然资源供给、环境问题与人类社会发展及国家安全之间关系的学科领域。
    includes:
      - 自然环境的服务功能与自然资源利用
      - 资源安全（能源、耕地粮食、海洋空间）与国家安全
      - 环境安全（环境污染、生态保护、全球气候变化）与国家安全
      - 保障资源环境安全的战略、政策与国际合作
    excludes:
      - 自然地理要素的组成、运动过程和一般规律（归入自然地理）
      - 人口、城镇、产业和交通运输的一般原理（归入人文地理）
      - 一般性的区域差异和区域转型机制（归入区域发展）
      - RS、GNSS、GIS 等地理信息技术的技术原理（现阶段不纳入 taxonomy 主干）
    aliases: []
    source_refs:
      - ima_knowledge_base: aaa
        source_document: 普通高中教科书·地理选择性必修3 资源、环境与国家安全
        source_locator: 全册
    status: draft
    confidence: high
    needs_review: false
    review_note: ""

