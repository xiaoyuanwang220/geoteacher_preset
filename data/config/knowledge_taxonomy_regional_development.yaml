  - id: KU-REG-ECOFRAGILE-003
    level: knowledge_unit
    name: 生态脆弱区的综合治理
    parent_id: TH-REG-ECOFRAGILE
    definition: 以保护恢复自然环境为第一要务，综合运用生物、工程、经济和社会措施治理生态脆弱区土地退化以实现可持续发展的机制。
    includes:
      - 以保护恢复自然环境为第一要务的观念
      - 根据土地适宜性优化土地利用结构
      - 综合运用生物、工程、经济和社会措施
      - 减少不合理人类干扰并促进自然恢复
      - 协调生产方式、人口、资源与环境的关系
    excludes:
      - 具体地区的治理案例和数据
      - 针对北方农牧交错带的具体畜种调整和防护工程方案
    aliases: []
    source_refs:
      - ima_knowledge_base: aaa
        source_document: 普通高中教科书·地理选择性必修2 区域发展
        source_locator: 第二章第二节"生态脆弱区的综合治理"——"北方农牧交错带土地退化的综合治理"
    status: draft
