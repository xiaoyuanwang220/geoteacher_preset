  # ---------- 主题 3：生态脆弱区的发展与治理 ----------
  - id: TH-REG-ECOFRAGILE
    level: theme
    name: 生态脆弱区的发展与治理
    parent_id: DM-REG
    definition: 研究生态系统抗干扰能力弱的区域的土地退化成因及其综合治理机制，以实现生态脆弱区的可持续发展。
    includes: []
    excludes:
      - 资源安全和环境安全的一般原理（归入资源、环境与国家安全）
      - 具体地区的治理案例结论
    aliases: []
    source_refs:
      - ima_knowledge_base: aaa
        source_document: 普通高中教科书·地理选择性必修2 区域发展
        source_locator: 第二章第二节"生态脆弱区的综合治理"
    status: draft
    confidence: medium
    needs_review: true
    review_note: "该主题与'资源、环境与国家安全'领域存在边界交叉。教材从区域发展角度讨论特定类型区域的治理机制，但土地退化和生态治理内容也可能属于资源环境安全领域。待跨领域审查时确认归属。"

