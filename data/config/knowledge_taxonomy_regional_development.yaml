# 高中地理 Taxonomy — 区域发展部分（跨册整合草案 v0.2-draft）
#
# 来源：ima 知识库「aaa」→ 高中文件夹
#   - 普通高中教科书·地理选择性必修2 区域发展（人教版 2019，樊杰、高俊昌总主编；葛岳静、覃燕飞本册主编）
#   - 普通高中教科书·地理必修 第二册第五章第三节（人教版 2019）
#
# 结构：domain → theme → knowledge_unit（三层教材主干）
# 本版已比较选择性必修2与必修第二册第五章第三节的相关原文并完成跨册整合。
# 案例、问题研究、情境、能力表达均未进入主干。
# 所有节点均基于教材原文提取，未使用 Agent 记忆或网络摘要。

meta:
  subject: 高中地理
  taxonomy_name: 区域发展知识点体系（跨册整合草案）
  version: v0.2-draft
  status: draft
  constructed_at: "2026-07-28"
  source_textbooks:
    - ima_knowledge_base: aaa
      source_document: 普通高中教科书·地理选择性必修2 区域发展
      publisher: 人民教育出版社
      edition: 2019
      chief_editor: 樊杰、高俊昌
      volume_editor: 葛岳静、覃燕飞
    - ima_knowledge_base: aaa
      source_document: 普通高中教科书·地理必修 第二册
      publisher: 人民教育出版社
      edition: 2019
      relevant_chapters: 第五章第三节"中国国家发展战略举例"
  construction_basis: 依据 taxonomy_construction_rules.md，从 ima 原文逐节提取知识候选。
  notes:
    - 本文件以选择性必修2为主体，并已整合必修第二册第五章第三节中可形成稳定区域发展主干的内容。
    - 教材册、章、节仅为来源线索，不直接等于 taxonomy 层级。
    - 第二章标题"资源、环境与区域发展"未机械建立为单一主题；已区分区域发展条件、生态脆弱区治理和资源型城市转型三个独立主题。
    - 生态脆弱区和资源型区域分别具有明确教学对象、多个可独立教学的知识单元和稳定区域发展机制，因此保留为与城市、产业、区际联系并列的 L2 专题。
    - 一般性的自然地理过程、产业区位因素、城镇化概念、交通区位原理、资源安全与环境安全知识、地理信息技术原理均未纳入本领域主干。
    - needs_review=true 的节点存在粒度、父级、边界或来源疑问，需人工裁定。
    - 本版尚未使用代表性高考真题验证可映射性，结构检查通过不等于定稿。

# ============================================================
# L1 学科领域
# ============================================================
nodes:
  - id: DM-REG
    level: domain
    name: 区域发展
    parent_id: null
    definition: 研究区域的类型与整体性关联性、区域发展条件、特定类型区域的发展与转型机制、城市辐射带动、产业结构变化以及区际联系与区域协调发展的学科领域。
    includes:
      - 区域的概念、类型、空间尺度和整体性关联性
      - 自然条件和资源禀赋对区域发展路径的影响
      - 生态脆弱区的发展与治理机制
      - 资源型城市的发展阶段与转型机制
      - 城市辐射功能与城市体系
      - 地区产业结构变化与升级
      - 流域协作、资源跨区域调配、产业转移和国际合作等区际联系机制
    excludes:
      - 自然地理过程和自然环境要素的一般规律（归入自然地理）
      - 人口、城镇化、农业区位、工业区位、服务业区位、交通区位的一般原理（归入人文地理）
      - 资源安全、环境安全、粮食安全、能源安全和国家安全的一般原理（归入资源、环境与国家安全）
      - RS、GNSS、GIS 等地理信息技术的技术原理和工具操作（现阶段不纳入 taxonomy 主干）
      - 具体国家、城市、地区、企业、工程和区域开发案例
    aliases: []
    source_refs:
      - ima_knowledge_base: aaa
        source_document: 普通高中教科书·地理选择性必修2 区域发展
        source_locator: 全册
    status: draft
    confidence: high
    needs_review: false
    review_note: ""

