    review_note: ""

  - id: KU-REG-REGION-003
    level: knowledge_unit
    name: 区域整体性
    parent_id: TH-REG-REGION
    definition: 区域内自然要素和人文要素相互作用、相互制约构成的整体特征及其对区域发展的影响。
    includes:
      - 自然要素（地质、地貌、气候、水文、生物、土壤）与人文要素（人口、文化、经济）
      - 要素间的直接和间接影响关系
      - 区域整体性对区域发展的影响
    excludes:
      - 自然环境整体性的自然地理过程机制（归入自然地理"自然环境的整体性与差异性"）
