  - id: KU-REG-CONDITION-002
    level: knowledge_unit
    name: 自然资源与区域发展
    parent_id: TH-REG-CONDITION
    definition: 自然资源作为区域发展物质基础的作用机制，以及在不同发展阶段不同种类自然资源对区域发展的影响差异。
    includes:
      - 自然资源是区域发展的物质基础
      - 不同发展阶段影响区域发展的自然资源种类不同（农业社会→土地资源，工业社会→矿产资源）
      - 自然资源区域分布与组合的不平衡性
      - 自然资源开发利用方式对区域发展的关键作用
    excludes:
