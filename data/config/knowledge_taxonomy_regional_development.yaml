    parent_id: TH-REG-REGION
    definition: 区域在空间范围上的层级大小关系以及不同尺度区域间的发展互动机制。
    includes:
      - 区域空间尺度与层级高低的关系
      - 较大尺度区域包含较小尺度区域
      - 不同尺度区域发展的相互促进
      - 同一尺度区域因面积和位置差异产生不同发展条件
    excludes: []
