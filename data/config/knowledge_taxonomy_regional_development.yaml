  - id: KU-REG-REGION-001
    level: knowledge_unit
    name: 区域的概念与类型
    parent_id: TH-REG-REGION
    definition: 人们在地球表面按照一定目的和标准划定的空间单元及其按自然特征、人文特征或综合特征划分的不同类型。
    includes:
      - 区域的概念（具有一定范围、形状和边界的空间单元）
      - 按自然特征划分的区域（如气候区、地形区）
      - 按人文特征划分的区域（如行政区、方言区）
      - 综合自然和人文特征划分的区域（如主体功能区）
      - 区域边界的明确性与过渡性
    excludes:
      - 具体区域名称作为独立知识点
      - 具体方言分布、行政区划数据
