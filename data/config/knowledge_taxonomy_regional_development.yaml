      - 主要分布区域（干湿交替、农牧交错、水陆交界、森林边缘、沙漠边缘等）
      - 生态系统稳定性差和土地易退化的特征
    excludes:
      - 具体生态脆弱区的环境数据
    aliases: []
    source_refs:
      - ima_knowledge_base: aaa
        source_document: 普通高中教科书·地理选择性必修2 区域发展
        source_locator: 第二章第二节"生态脆弱区的综合治理"——"生态脆弱区"
    status: draft
    confidence: high
    needs_review: false
    review_note: ""

  - id: KU-REG-ECOFRAGILE-002
    level: knowledge_unit
    name: 土地退化及成因
    parent_id: TH-REG-ECOFRAGILE
    definition: 受自然因素和人类活动影响导致土地质量下降、生产力降低的过程，以及不同生态脆弱区土地退化成因的分析框架。
    includes:
      - 土地退化的概念和表现（土地沙化、石漠化、土壤侵蚀、盐碱化、肥力下降等）
      - 自然背景对土地稳定性和恢复能力的影响
      - 过度开垦、过度放牧、不合理开矿等人类活动的影响
      - 自然因素和人为因素共同作用的成因分析框架
