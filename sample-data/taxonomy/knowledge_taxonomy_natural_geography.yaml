# 高中地理 Taxonomy — 自然地理部分（跨册整合 v0.2-draft）
#
# 来源：ima 知识库「aaa」→ 高中文件夹
#   - 普通高中教科书·地理必修 第一册（人教版 2019，李秀彬、丁尧清主编）
#   - 普通高中教科书·地理选择性必修1 自然地理基础（人教版 2019，袁孝亭、丁尧清主编）
#
# 结构：domain → theme → knowledge_unit（三层教材主干）
# 本版已跨册去重；案例、问题研究、情境、能力表达均未进入主干。
# 所有节点均基于教材原文提取，未使用 Agent 记忆或网络摘要。

meta:
  subject: 高中地理
  taxonomy_name: 自然地理知识点体系（跨册整合）
  version: v0.2-draft
  status: draft
  constructed_at: "2026-07-28"
  source_textbooks:
    - ima_knowledge_base: aaa
      source_document: 普通高中教科书·地理必修 第一册
      publisher: 人民教育出版社
      edition: 2019
    - ima_knowledge_base: aaa
      source_document: 普通高中教科书·地理选择性必修1 自然地理基础
      publisher: 人民教育出版社
      edition: 2019
  construction_basis: 依据 taxonomy_construction_rules.md，从 ima 原文逐节提取知识候选并跨册去重。
  notes:
    - 本文件是替代原有 v0.1 自然地理部分的候选草案；完成语法校验、边界审查和代表性真题验证后，方可作为正式映射词表。
    - 教材册、章、节仅为来源线索，不直接等于 taxonomy 层级。
    - 同一知识跨册出现时只保留一个节点，source_refs 记录多个来源。
    - needs_review=true 的节点存在粒度、父级或来源疑问，需人工裁定。
    - 本版尚未使用代表性真题验证可映射性，结构检查通过不等于定稿。

# ============================================================
# L1 学科领域
# ============================================================
nodes:
  - id: DM-NAT
    level: domain
    name: 自然地理
    parent_id: null
    definition: 研究地球自然环境各要素的组成、结构、运动规律及相互关系的学科领域。
    includes:
      - 地球的宇宙环境与运动
      - 大气、水、地表形态、植被与土壤等自然要素
      - 自然灾害的成因机制
      - 自然环境的整体性与差异性
    excludes:
      - 人口、城市、产业等人文地理内容
      - 区域发展分析
      - 资源、环境与国家安全的管理对策
    aliases: []
    source_refs:
      - ima_knowledge_base: aaa
        source_document: 普通高中教科书·地理必修 第一册
        source_locator: 全册
      - ima_knowledge_base: aaa
        source_document: 普通高中教科书·地理选择性必修1 自然地理基础
        source_locator: 全册
    status: draft
    confidence: high
    needs_review: false
    review_note: ""

