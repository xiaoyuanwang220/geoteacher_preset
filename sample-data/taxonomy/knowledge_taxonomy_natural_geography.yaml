  - id: KU-NAT-UNIVERSE-004
    level: knowledge_unit
    name: 太阳系行星的特征与地球的特殊性
    parent_id: TH-NAT-UNIVERSE
    definition: 八大行星的运动与结构特征，以及地球存在高级智慧生命的条件。
    includes:
      - 类地行星与巨行星、远日行星的分类
      - 八大行星运动的同向性、共面性、近圆性
      - 地球普通性（距日、体积、运动）与特殊性（存在生命）
      - 地球存在生命的温度、水、大气等条件
    excludes:
      - 具体行星名称作为独立知识点
    aliases: []
    source_refs:
