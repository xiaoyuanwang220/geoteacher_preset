    status: draft
    confidence: medium
    needs_review: true
    review_note: "“太阳系行星的特征”和“地球的特殊性”是否需要拆分，待代表性真题验证。"

  - id: KU-NAT-UNIVERSE-005
    level: knowledge_unit
    name: 天文观测的自然环境条件
    parent_id: TH-NAT-UNIVERSE
    definition: 影响地面天文观测清晰度、稳定性和可观测时长的地形、大气与光环境条件。
    includes:
      - 海拔高、大气稀薄对减少大气削弱和扰动的作用
      - 晴夜多、云量少和空气干燥对延长有效观测时间的作用
      - 大气稳定、视宁度好对提高观测清晰度的作用
      - 远离城市灯光形成暗夜环境
      - 减少光污染和电磁干扰
    excludes:
      - 天文观测仪器的发展史和操作方法
      - 天体与天体系统的一般分类
      - 具体天文台址案例
    aliases:
      - 天文观测台址条件
      - 天文观测环境要求
    source_refs:
      - ima_knowledge_base: aaa
        source_document: 普通高中教科书·地理必修 第一册
        source_locator: 第一章第一节"地球在宇宙中的位置"（天文观测与宇宙环境学习情境）
    validation_refs:
      - source_document: 精品解析：2025年浙江6月高考地理真题（解析版）.docx
        question_numbers: "2"
    status: draft
    confidence: high
    needs_review: false
    review_note: "经教师结合2025年浙江6月卷第2题确认，天文观测对自然环境的要求具有独立解题价值。"

