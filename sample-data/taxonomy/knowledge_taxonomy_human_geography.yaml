        source_document: 普通高中教科书·地理必修 第二册
        source_locator: 第一章
    status: draft
    confidence: high
    needs_review: false
    review_note: ""

  - id: KU-HUM-POP-001
    level: knowledge_unit
    name: 人口分布
    parent_id: TH-HUM-POPULATION
    definition: 人口在地理空间上的分布状况及其影响因素。
    includes:
      - 世界人口分布不均匀，主要集中在北半球中低纬度、沿海和低平地区
      - 四大人口稠密区（东亚、南亚、欧洲西部、北美东部）
      - 各大洲和各国人口分布的不平衡性
      - 自然因素（气候、地形、水源）对人口分布的影响
      - 人文因素（生产力水平与生产方式、经济发展水平、历史、政治军事文化）对人口分布的影响
    excludes:
      - 人口迁移（归入人口迁移节点）
      - 具体国家或地区的人口数据
    aliases: []
    source_refs:
      - ima_knowledge_base: aaa
        source_document: 普通高中教科书·地理必修 第二册
        source_locator: 第一章第一节"人口分布"
    status: draft
    confidence: high
    needs_review: false
    review_note: ""

  - id: KU-HUM-POP-002
    level: knowledge_unit
    name: 人口迁移
    parent_id: TH-HUM-POPULATION
    definition: 涉及人口居住地发生长期或永久改变的人口移动现象。
    includes:
      - 人口迁移的概念与判别（居住地长期或永久改变）
      - 国际人口迁移与国内人口迁移的分类
      - 人口机械增长与机械增长率的概念和计算
      - 人口迁移对迁出地、迁入地和迁移者的影响
    excludes:
      - 暂时性人口移动（探亲、出差、旅游等）
      - 影响人口迁移的因素（归入影响人口迁移的因素节点）
    aliases: []
    source_refs:
      - ima_knowledge_base: aaa
        source_document: 普通高中教科书·地理必修 第二册
        source_locator: 第一章第二节"人口迁移"
    status: draft
    confidence: high
    needs_review: false
    review_note: ""

  - id: KU-HUM-POP-003
    level: knowledge_unit
    name: 影响人口迁移的因素
    parent_id: TH-HUM-POPULATION
    definition: 迁出地推力与迁入地拉力共同构成的人口迁移动力机制及其自然和人文因素。
    includes:
      - 推拉理论的基本框架（推力、拉力、迁移障碍）
      - 自然因素（自然环境差异、环境问题、自然灾害）对人口迁移的影响
      - 经济因素作为主导因素的作用机制
      - 政治、军事、文化等人文因素对人口迁移的影响
    excludes:
      - 人口迁移的概念与分类（归入人口迁移节点）
      - 具体国家或历史时期的迁移案例
    aliases: []
    source_refs:
      - ima_knowledge_base: aaa
        source_document: 普通高中教科书·地理必修 第二册
        source_locator: 第一章第二节"影响人口迁移的因素"
    status: draft
    confidence: high
    needs_review: false
    review_note: ""

  - id: KU-HUM-POP-004
    level: knowledge_unit
    name: 人口迁移的时空特点
    parent_id: TH-HUM-POPULATION
    definition: 不同历史时期和空间尺度下人口迁移所表现出的特征与变化。
    includes:
      - 19世纪以前国际人口迁移的特点（集团性、大规模移民为主）
      - 二战后国际人口迁移的新变化（发展中国家流向发达国家、外籍工人成为主要形式）
      - 国内人口迁移的一般规律（工业化后农村向城镇迁移为主）
      - 中国改革开放前后国内人口迁移的阶段特点
    excludes:
      - 具体国家的人口迁移数据
    aliases: []
    source_refs:
      - ima_knowledge_base: aaa
        source_document: 普通高中教科书·地理必修 第二册
        source_locator: 第一章第二节"人口迁移的时空特点"
    status: draft
    confidence: high
    needs_review: false
    review_note: ""

  - id: KU-HUM-POP-005
    level: knowledge_unit
    name: 区域资源环境承载力
    parent_id: TH-HUM-POPULATION
    definition: 在保证资源合理开发利用和保护良好生态环境的前提下，区域的资源环境条件所能承载的人口数量。
    includes:
      - 区域资源环境承载力的概念
      - 自然资源状况的影响（木桶短板效应）
      - 社会经济和科技发展水平的影响（资源利用效率提高、贸易获取外部资源）
      - 人均消费水平的影响（消费水平越高承载力越低）
    excludes:
      - 人口合理容量（归入人口合理容量节点）
    aliases:
      - 资源环境承载力
    source_refs:
      - ima_knowledge_base: aaa
        source_document: 普通高中教科书·地理必修 第二册
        source_locator: 第一章第三节"区域资源环境承载力"
    status: draft
    confidence: high
    needs_review: false
    review_note: ""

  - id: KU-HUM-POP-006
    level: knowledge_unit
    name: 人口合理容量
    parent_id: TH-HUM-POPULATION
    definition: 按照合理的生活方式、保障健康生活水平且不妨碍未来人口生活质量的前提下，一个国家或地区最适宜的人口数量。
    includes:
      - 人口合理容量的概念
      - 人口合理容量与资源环境承载力的关系（前者数值小于后者）
      - 人口合理容量对制定人口战略和人口政策的意义
      - 追求人口合理容量与人地协调发展的关系
    excludes:
      - 区域资源环境承载力的概念与影响因素（归入区域资源环境承载力节点）
    aliases: []
    source_refs:
      - ima_knowledge_base: aaa
        source_document: 普通高中教科书·地理必修 第二册
        source_locator: 第一章第三节"人口合理容量"
    status: draft
    confidence: high
    needs_review: false
    review_note: ""

  - id: KU-HUM-POP-007
    level: knowledge_unit
    name: 人口年龄结构
    parent_id: TH-HUM-POPULATION
    definition: 人口按年龄组构成的比例关系及其所反映的人口增长、劳动力供给和老龄化特征。
    includes:
      - 少年儿童、劳动年龄和老年人口的构成
      - 年轻型、成年型和老年型人口结构的判读
      - 人口年龄结构图与人口年龄金字塔的判读
      - 年龄结构变化对人口增长和社会经济发展的影响
    excludes:
      - 各年龄组相对于劳动年龄人口的负担关系（归入人口抚养比节点）
      - 具体国家或地区的年龄结构数据
    aliases:
      - 人口年龄构成
    source_refs:
      - ima_knowledge_base: aaa
        source_document: 普通高中教科书·地理必修 第二册
        source_locator: 第一章人口相关资料判读
