  - id: KU-HUM-SET-002
    level: knowledge_unit
    name: 城镇内部空间结构
    parent_id: TH-HUM-SETTLEMENT
    definition: 城镇土地利用专业化形成的不同功能区及其空间分布组合。
    includes:
      - 城镇功能区的概念（居住区、商业区、工业区等）
      - 各功能区的空间分布规律（商业区位于中心或交通干线两侧、工业区靠近交通线远离中心）
      - 功能区之间无明确界线的特征
      - 中央商务区（CBD）的概念
    excludes:
      - 城镇内部空间结构的形成机制（归入城镇内部空间结构的形成与变化节点）
