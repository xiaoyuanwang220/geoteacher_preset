  - id: KU-HUM-SET-005
    level: knowledge_unit
    name: 城镇化
    parent_id: TH-HUM-SETTLEMENT
    definition: 乡村人口向城镇地区集聚和乡村地区转变为城镇地区的过程及其对区域发展的意义。
    includes:
      - 城镇化的概念与三个主要标志（城镇人口增加、城镇人口比例上升、城镇建设用地规模扩大）
      - 城镇人口占总人口比例作为衡量城镇化水平的最重要指标
      - 城镇化与工业化的密切关系
      - 城镇化对区域发展的积极作用（促进经济增长、提高资源利用效率、改善居住环境、增强社会和谐）
    excludes:
      - 世界城镇化进程的阶段特征（归入世界城镇化进程节点）
      - 城镇化过程中出现的问题（归入城镇化问题节点）
