    level: knowledge_unit
    name: 乡村土地利用
    parent_id: TH-HUM-SETTLEMENT
    definition: 乡村以农业经济活动为主的土地利用类型及村落内部的空间分化。
    includes:
      - 农业用地类型（耕地、林地、草地、水域）
      - 农业用地一般分布在村落周围的规律
      - 村落内部土地利用的简单分化（以公共服务设施为中心的住宅分布）
    excludes:
