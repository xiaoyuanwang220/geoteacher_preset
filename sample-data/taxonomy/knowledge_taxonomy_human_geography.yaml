# 高中地理 Taxonomy — 人文地理部分（跨册审查草案 v0.2-draft）
#
# 来源：ima 知识库「aaa」→ 高中文件夹
#   - 普通高中教科书·地理必修 第二册（人教版 2019，樊杰、高俊昌总主编；袁书琪、刘健本册主编）
#
# 结构：domain → theme → knowledge_unit（三层教材主干）
# 主干节点来自必修第二册，并已与选择性必修2、选择性必修3相关内容完成跨册边界审查。
# 案例、问题研究、情境、能力表达均未进入主干。
# 所有节点均基于教材原文提取，未使用 Agent 记忆或网络摘要。

meta:
  subject: 高中地理
  taxonomy_name: 人文地理知识点体系（跨册审查草案）
  version: v0.2-draft
  status: draft
  constructed_at: "2026-07-28"
  source_textbooks:
    - ima_knowledge_base: aaa
      source_document: 普通高中教科书·地理必修 第二册
      publisher: 人民教育出版社
      edition: 2019
      chief_editor: 樊杰、高俊昌
      volume_editor: 袁书琪、刘健
  construction_basis: 依据 taxonomy_construction_rules.md，从 ima 原文逐节提取知识候选。
  cross_book_comparison_sources:
    - ima_knowledge_base: aaa
      source_document: 普通高中教科书·地理选择性必修2 区域发展
      comparison_scope: 区域发展、城市辐射、产业结构、区际联系
    - ima_knowledge_base: aaa
      source_document: 普通高中教科书·地理选择性必修3 资源、环境与国家安全
      comparison_scope: 自然资源、环境问题、资源环境安全
  notes:
    - 本文件的人文地理主干来自必修第二册，并已与选择性必修2、选择性必修3相关内容完成跨册边界审查。
    - 教材第五章"环境与发展"内容已分别纳入"资源、环境与国家安全"或"区域发展" taxonomy，不在人文地理重复建节点。
    - 地理信息技术原先因 MVP 范围暂不纳入；经教师确认其属于核心考点，现已建立独立主题并先纳入 GNSS 技术原理与应用节点。
    - 教材册、章、节仅为来源线索，不直接等于 taxonomy 层级。
    - needs_review=true 的节点存在粒度、父级或来源疑问，需人工裁定。
    - 本版尚未使用代表性真题验证可映射性，结构检查通过不等于定稿。

# ============================================================
# L1 学科领域
# ============================================================
nodes:
  - id: DM-HUM
    level: domain
    name: 人文地理
    parent_id: null
    definition: 研究人类活动与地理环境相互关系的学科领域，涵盖人口、聚落、产业、交通运输、地理调查方法以及地理信息技术应用等内容。
    includes:
      - 人口的分布、迁移与容量
      - 乡村和城镇的空间结构与城镇化
      - 农业、工业和服务业的区位因素
      - 交通运输布局与区域发展的相互关系
      - 人文地理调查方案的设计与实施
      - 地理信息技术的原理与应用
    excludes:
      - 地球自然环境各要素的组成与运动规律（归入自然地理）
      - 环境问题、可持续发展与国家发展战略（归入资源、环境与国家安全或区域发展）
    aliases: []
    source_refs:
      - ima_knowledge_base: aaa
        source_document: 普通高中教科书·地理必修 第二册
        source_locator: 全册
    status: draft
    confidence: high
    needs_review: false
    review_note: ""

