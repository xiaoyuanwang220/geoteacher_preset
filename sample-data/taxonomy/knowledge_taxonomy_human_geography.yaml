    review_note: ""

  - id: KU-HUM-POP-008
    level: knowledge_unit
    name: 人口抚养比
    parent_id: TH-HUM-POPULATION
    definition: 非劳动年龄人口与劳动年龄人口的数量比值及其所反映的人口年龄负担关系。
    includes:
      - 总抚养比、少年儿童抚养比和老年人口抚养比
      - 老年人口抚养比等于总抚养比与少年儿童抚养比之差
      - 抚养比变化与人口年龄结构的关系
      - 抚养比图表的计算与判读
    excludes:
      - 年龄组构成本身（归入人口年龄结构节点）
      - 具体国家或地区的抚养比数据
