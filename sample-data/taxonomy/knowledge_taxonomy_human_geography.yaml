  # ---------- 主题 1：人口 ----------
  - id: TH-HUM-POPULATION
    level: theme
    name: 人口
    parent_id: DM-HUM
    definition: 研究人口的空间分布、年龄结构、迁移规律及其与资源环境承载力的关系。
    includes: []
    excludes: []
    aliases: []
    source_refs:
