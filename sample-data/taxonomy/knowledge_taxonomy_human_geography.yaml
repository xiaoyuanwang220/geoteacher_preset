  - id: KU-HUM-SET-003
    level: knowledge_unit
    name: 城镇内部空间结构的形成与变化
    parent_id: TH-HUM-SETTLEMENT
    definition: 经济因素主导下城镇各功能区土地利用的竞争机制及空间结构随城镇发展的动态演变。
    includes:
      - 经济因素（地租）作为影响城镇内部空间结构的主要因素
      - 地租与交通便捷程度、距城镇中心远近的关系
      - 各类土地利用付租能力随距市中心距离递减的规律
      - 政策、文化、环境等因素对空间结构的影响
      - 城镇空间结构随发展阶段变化的规律（初期混杂分布→功能分化→中心工业外迁）
    excludes:
      - 功能区的类型与分布规律（归入城镇内部空间结构节点）
