<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="建模完成判定">
  <title>ModelCheck</title>
  <defs>
    <linearGradient id="mc-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2f6fed"/>
      <stop offset="1" stop-color="#16a37b"/>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#mc-bg)"/>
  <!-- 环流示意：断口处被判定闭合 -->
  <path d="M32 12a20 20 0 1 1-14.1 5.9" fill="none" stroke="#ffffff" stroke-opacity="0.55"
        stroke-width="3.2" stroke-linecap="round" stroke-dasharray="7 5"/>
  <path d="M18 18l5.2 5.2" fill="none" stroke="#ffffff" stroke-opacity="0.55"
        stroke-width="3.2" stroke-linecap="round"/>
  <!-- 判定勾 -->
  <path d="M22 33.5l7 7 14-15" fill="none" stroke="#ffffff" stroke-width="5"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
