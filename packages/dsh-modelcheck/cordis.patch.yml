# ModelCheck —— profile 级 bundle patch
#
# 插入一行：模块名即本包。宿主半边 index.js 提供：
#   · /modelcheck/api          面板与工具共用的 JSON 接口
#   · /modelcheck/preview/*    项目内模型文件的同源预览（入口 HTML 注入取证桥接）
#   · /modelcheck/assets/*     桥接脚本等静态资源
#   · 7 个 modelcheck_* 模型工具（无 .modelcheck 目录时全部返回 inactive，不干预会话）
# 客户端半边由 dsh-client-modules 依据 package.json 的 dsh.client 发现，
# 在 conversation.view 槽位注册「建模判定」面板。
#
# 路由前缀独占：/modelcheck 下未注册的子路径返回 404，不与其他插件冲突。
- insert:
    - id: modelcheck
      name: '@geo-edu/dsh-modelcheck'
