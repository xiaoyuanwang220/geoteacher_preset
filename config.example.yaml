# GeoTeacher — config example (copy to your own deployment)

# 1) Agent preset config (equivalent of preset/agent.cordis.yml, geo group):
#    Replace <...> placeholders with your environment before deploying.
#    You usually edit preset/agent.cordis.yml directly; this file documents
#    every tunable knob.

# ── geo-core: data paths ────────────────────────────────────────────────────
knowledgeBasePath: <KB_ROOT>/config                  # taxonomy yaml dir
questionBankPath: <KB_ROOT>/obsidian_vault/04_题目   # question-bank md dir
outputPath: <WORKSPACE>/outputs                      # analysis exports / index
workspaceRoot: <WORKSPACE>                           # sandbox write root

# ── geo-vision: GeoTeacher adapter ──────────────────────────────────────────
# This flag controls only the adapter. The DSH host must separately provide
# dshVision; that host component owns provider/model credentials, attachment
# persistence, cache, retries, OCR/inspection routing and result validation.
vision:
  enabled: true

# Host prerequisite (configured outside this repository):
# - publish a compatible dshVision service;
# - expose vision_inspect and vision_ocr for standalone user images if needed;
# - configure provider, model and credentials in the host vision component.
